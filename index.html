<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título, descrição, canonical e OG agora saem do <Seo> de cada página
         (src/components/site/Seo.tsx) e são gravados no HTML durante o build.
         O que fica aqui é só o fallback e o que não varia por rota. -->
    <title>G2 Engenharia e Consultoria</title>
    <meta name="author" content="G2 Engenharia e Consultoria" />
    <meta name="theme-color" content="#223143" />

    <!-- Ícones gerados a partir do símbolo da marca, sobre o navy #223143 —
         o símbolo tem fundo transparente e sumiria na aba escura do navegador. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icone-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icone-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poppins e Lato são as fontes da apresentação institucional da G2.
         Poppins entra nos títulos e Lato no corpo. A Fraunces saiu: o material
         da empresa não tem serifa, e o destaque em itálico passa a ser feito
         por peso (Poppins 300) em vez de por mudança de família. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
